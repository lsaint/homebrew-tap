name: Update Aikito Formula

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Aikito release version (e.g. 1.44.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  update-formula:
    name: Update Formula for Aikito ${{ inputs.version }}
    runs-on: macos-latest
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Checkout homebrew-tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Verify Formula update rules
        run: python3 -m unittest discover -s tests

      - name: Fetch PyPI metadata and update Formula
        id: pypi
        run: python3 scripts/update_aikito.py "$VERSION"
        env:
          VERSION: ${{ inputs.version }}

      - name: Check git diff
        id: diff
        run: |
          git diff Formula/aikito.rb
          if git diff --quiet Formula/aikito.rb; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Formula is already up-to-date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Syntax and style check
        run: |
          ruby -c Formula/aikito.rb
          brew tap lsaint/tap "$GITHUB_WORKSPACE"
          brew style lsaint/tap/aikito

      - name: Commit Formula changes locally
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aikito.rb
          git commit -m "aikito ${{ inputs.version }}"

      - name: Tap local repository and audit Formula
        run: |
          brew tap lsaint/tap "$GITHUB_WORKSPACE"
          brew audit --strict --formula lsaint/tap/aikito

      - name: Build and test Formula
        run: |
          brew install --build-from-source lsaint/tap/aikito
          brew test lsaint/tap/aikito
          aikito --version

      - name: Push to main
        if: steps.diff.outputs.changed == 'true'
        run: |
          git push origin main
          echo "Pushed commit $(git rev-parse HEAD) to origin/main"
